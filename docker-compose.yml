name: dbdhub

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: DBDHubDB
      POSTGRES_USER: dbdhub_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbdhub_local_pw}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbdhub_user -d DBDHubDB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-init:
    image: dbdhub-app:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=DBDHubDB;Username=dbdhub_user;Password=${POSTGRES_PASSWORD:-dbdhub_local_pw}"
    command: ["--migrate", "--seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: dbdhub-app:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=DBDHubDB;Username=dbdhub_user;Password=${POSTGRES_PASSWORD:-dbdhub_local_pw}"
      ConnectionStrings__Redis: "redis:6379"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
