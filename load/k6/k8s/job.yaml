apiVersion: batch/v1
kind: Job
metadata:
  name: k6-match-load
  namespace: dbdhub
  labels:
    app: k6-match-load
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: k6-match-load
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          imagePullPolicy: IfNotPresent
          args: ["run", "/scripts/match-load.js"]
          env:
            - name: BASE_URL
              value: "http://dbdhub-app"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: k6-match-load
