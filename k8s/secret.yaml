# Credenciales de demostracion. Reemplazar antes de usar en produccion.
apiVersion: v1
kind: Secret
metadata:
  name: dbdhub-secrets
  namespace: dbdhub
type: Opaque
stringData:
  POSTGRES_DB: DBDHubDB
  POSTGRES_USER: dbdhub_user
  POSTGRES_PASSWORD: dbdhub_local_pw
  ConnectionStrings__DefaultConnection: "Host=dbdhub-postgres;Port=5432;Database=DBDHubDB;Username=dbdhub_user;Password=dbdhub_local_pw"
