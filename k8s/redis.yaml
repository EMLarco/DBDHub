apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbdhub-redis
  namespace: dbdhub
  labels:
    app: dbdhub-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbdhub-redis
  template:
    metadata:
      labels:
        app: dbdhub-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dbdhub-redis
  namespace: dbdhub
  labels:
    app: dbdhub-redis
spec:
  type: ClusterIP
  selector:
    app: dbdhub-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
