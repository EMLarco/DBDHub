apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dbdhub-postgres-data
  namespace: dbdhub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbdhub-postgres
  namespace: dbdhub
  labels:
    app: dbdhub-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dbdhub-postgres
  template:
    metadata:
      labels:
        app: dbdhub-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: dbdhub-secrets
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dbdhub-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: dbdhub-postgres
  namespace: dbdhub
  labels:
    app: dbdhub-postgres
spec:
  type: ClusterIP
  selector:
    app: dbdhub-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
