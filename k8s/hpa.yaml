apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dbdhub-app
  namespace: dbdhub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dbdhub-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
